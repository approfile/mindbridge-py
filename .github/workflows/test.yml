name: Test

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      AI_PROVIDER: mock
      DATABASE_URL: sqlite:///./target/ci-test.sqlite3
      REDIS_URL: redis://127.0.0.1:1/15
      REDIS_SOCKET_TIMEOUT_SECONDS: "0.1"
      KNOWLEDGE_VECTOR_ENABLED: "false"
      PRIVACY_KEY_FILE: target/ci-privacy.key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-evaluation.txt
      - name: Prepare scratch directories
        run: mkdir -p target data
      - name: Compile app
        run: python -m compileall app tests
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Engineering harness
        run: python -m app.harness.runner
