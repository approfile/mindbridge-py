<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 852" width="1100" height="852" font-family="Segoe UI, Roboto, Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" role="img" aria-label="Claim-based actor runtime: agents observe open tasks, claim work by confidence and publish immutable artifacts to a shared blackboard; a five-condition acceptance gate decides the final reply">
  <title>MindBridge — claim-based multi-agent collaboration runtime</title>
  <defs>
    <marker id="mk-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="mg" d="M 0 0 L 10 5 L 0 10 z"/></marker>
    <marker id="mk-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="mv" d="M 0 0 L 10 5 L 0 10 z"/></marker>
    <marker id="mk-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="mr" d="M 0 0 L 10 5 L 0 10 z"/></marker>
    <marker id="mk-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="mb" d="M 0 0 L 10 5 L 0 10 z"/></marker>
    <marker id="mk-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="mt" d="M 0 0 L 10 5 L 0 10 z"/></marker>
    <marker id="mk-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="mgr" d="M 0 0 L 10 5 L 0 10 z"/></marker>
    <marker id="mk-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="ma" d="M 0 0 L 10 5 L 0 10 z"/></marker>
    <marker id="mk-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="ms" d="M 0 0 L 10 5 L 0 10 z"/></marker>
  </defs>
  <style>
  svg {
    --bg:#ffffff; --ink:#1c2530; --ink-strong:#0f172a; --muted:#5b6b7c; --muted-2:#64748b;
    --line:#e3e8ee; --card:#ffffff; --card-border:#cbd5e1; --arrow:#5b6b7c; --arrow-strong:#334155;
    --violet:#6d28d9; --violet-fill:#f5f3ff; --violet-line:#ddd6fe; --violet-ink:#4c1d95;
    --red:#b91c1c; --red-fill:#fef2f2; --red-line:#fecaca; --red-ink:#7f1d1d;
    --blue:#1d4ed8; --blue-fill:#eff6ff; --blue-line:#bfdbfe; --blue-ink:#1e3a8a;
    --teal:#0f766e; --teal-fill:#f0fdfa; --teal-line:#99f6e4; --teal-ink:#134e4a;
    --green:#15803d; --green-fill:#f0fdf4; --green-line:#bbf7d0; --green-ink:#14532d;
    --amber:#b45309; --amber-fill:#fffbeb; --amber-line:#fde68a; --amber-ink:#78350f;
    --slate:#334155; --slate-fill:#f8fafc; --slate-line:#cbd5e1; --slate-ink:#0f172a;
    --cyan:#0e7490; --cyan-fill:#ecfeff; --cyan-line:#a5f3fc; --cyan-ink:#155e75;
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --bg:#0d1117; --ink:#e6edf3; --ink-strong:#f0f6fc; --muted:#9da9b6; --muted-2:#8b949e;
      --line:#30363d; --card:#151b23; --card-border:#30363d; --arrow:#8b949e; --arrow-strong:#c9d1d9;
      --violet:#a78bfa; --violet-fill:#1b1630; --violet-line:#4c1d95; --violet-ink:#c4b5fd;
      --red:#f87171; --red-fill:#2a1316; --red-line:#7f1d1d; --red-ink:#fca5a5;
      --blue:#60a5fa; --blue-fill:#0f1a33; --blue-line:#1e3a8a; --blue-ink:#93c5fd;
      --teal:#2dd4bf; --teal-fill:#082420; --teal-line:#115e59; --teal-ink:#5eead4;
      --green:#4ade80; --green-fill:#0b2415; --green-line:#14532d; --green-ink:#86efac;
      --amber:#fbbf24; --amber-fill:#271d0b; --amber-line:#78350f; --amber-ink:#fcd34d;
      --slate:#94a3b8; --slate-fill:#151b23; --slate-line:#30363d; --slate-ink:#e6edf3;
      --cyan:#22d3ee; --cyan-fill:#07222a; --cyan-line:#155e75; --cyan-ink:#67e8f9;
    }
  }
  .bg{fill:var(--bg)}
  .ink{fill:var(--ink)} .inks{fill:var(--ink-strong)} .mut{fill:var(--muted)} .mut2{fill:var(--muted-2)}
  .div{stroke:var(--line)}
  .card{fill:var(--card)} .cardline{stroke:var(--card-border)}
  .fv{fill:var(--violet-fill)} .sv{stroke:var(--violet)} .tv{fill:var(--violet-ink)}
  .fr{fill:var(--red-fill)} .sr{stroke:var(--red)} .tr{fill:var(--red-ink)}
  .fb{fill:var(--blue-fill)} .sb{stroke:var(--blue)} .tb{fill:var(--blue-ink)}
  .ft{fill:var(--teal-fill)} .st{stroke:var(--teal)} .tt{fill:var(--teal-ink)}
  .fg{fill:var(--green-fill)} .sg{stroke:var(--green)} .tg{fill:var(--green-ink)}
  .fa{fill:var(--amber-fill)} .sa{stroke:var(--amber)} .ta{fill:var(--amber-ink)}
  .fs{fill:var(--slate-fill)} .ss{stroke:var(--slate)} .ts{fill:var(--slate-ink)}
  .fc{fill:var(--cyan-fill)} .sc{stroke:var(--cyan)} .tc{fill:var(--cyan-ink)}
  .lg{stroke:var(--arrow)} .lv{stroke:var(--violet)} .lr{stroke:var(--red)} .lb{stroke:var(--blue)}
  .lt{stroke:var(--teal)} .lgr{stroke:var(--green)} .la{stroke:var(--amber)} .ls{stroke:var(--slate)}
  .mg{fill:var(--arrow)} .mv{fill:var(--violet)} .mr{fill:var(--red)} .mb{fill:var(--blue)}
  .mt{fill:var(--teal)} .mgr{fill:var(--green)} .ma{fill:var(--amber)} .ms{fill:var(--slate)}
</style>
  <rect class="bg" width="1100" height="852"/>
  <text x="28" y="36" font-size="23" class="inks" font-weight="700">Claim-based actor runtime — observe, claim, publish</text>
  <text x="28" y="60" font-size="13.5" class="mut">No hard-coded agent chain: the coordinator owns the budget and the five-condition safety gate; workers race on confidence</text>
  <text x="1072" y="36" font-size="10.5" class="mut2" text-anchor="end" letter-spacing="1.6">MINDBRIDGE · AGENT RUNTIME</text>
  <line x1="28" y1="76" x2="1072" y2="76" class="div" stroke-width="1.4"/>
  <rect x="28" y="84" width="1044" height="32" rx="8" class="card cardline" stroke-width="1.0"/>
  <rect x="44" y="93" width="14" height="14" rx="3" class="fv sv" stroke-width="1.2"/>
  <text x="65" y="105" font-size="11.5" class="mut">coordination / scheduling</text>
  <rect x="251.0" y="93" width="14" height="14" rx="3" class="fr sr" stroke-width="1.2"/>
  <text x="272.0" y="105" font-size="11.5" class="mut">safety gate</text>
  <rect x="374.0" y="93" width="14" height="14" rx="3" class="fb sb" stroke-width="1.2"/>
  <text x="395.0" y="105" font-size="11.5" class="mut">understanding</text>
  <rect x="509.0" y="93" width="14" height="14" rx="3" class="ft st" stroke-width="1.2"/>
  <text x="530.0" y="105" font-size="11.5" class="mut">context / retrieval</text>
  <rect x="680.0" y="93" width="14" height="14" rx="3" class="fg sg" stroke-width="1.2"/>
  <text x="701.0" y="105" font-size="11.5" class="mut">response</text>
  <rect x="785.0" y="93" width="14" height="14" rx="3" class="fs ss" stroke-width="1.2"/>
  <text x="806.0" y="105" font-size="11.5" class="mut">shared state / acceptance</text>
  <rect x="28" y="124" width="600" height="164" rx="10" class="fv sv" stroke-width="1.6"/>
  <text x="46" y="150" font-size="15" class="tv" font-weight="700">CoordinatorAgent + EventDrivenCoordinator</text>
  <text x="46" y="176" font-size="12.5" class="ink">· creates the root task every turn; injects missing work each round</text>
  <text x="46" y="197" font-size="12.5" class="ink">· ranks claims: task priority → artifact confidence → agent name</text>
  <text x="46" y="218" font-size="12.5" class="ink">· budget: 8 rounds · 4 claims/round · max 3 claims per agent</text>
  <text x="46" y="239" font-size="12.5" class="ink">· runs the acceptance check at the end of every round</text>
  <text x="46" y="260" font-size="12.5" class="ink">· no orchestration framework: event loop + frozen dataclasses only</text>
  <rect x="660" y="124" width="412" height="164" rx="10" class="fr sr" stroke-width="1.6"/>
  <text x="678" y="150" font-size="15" class="tr" font-weight="700">Acceptance gate  _try_accept_final()</text>
  <text x="678" y="175" font-size="12" class="ink">1 · response_proposal artifact exists</text>
  <text x="678" y="192" font-size="12" class="ink">2 · safety_review artifact exists</text>
  <text x="678" y="209" font-size="12" class="ink">3 · review.responseArtifactId == proposal.id</text>
  <text x="678" y="226" font-size="12" class="ink">4 · review.approved is true</text>
  <text x="678" y="243" font-size="12" class="ink">5 · proposal.confidence ≥ 0.60</text>
  <rect x="678" y="262" width="376" height="20" rx="5" class="card cr" stroke-width="1.0"/>
  <text x="686" y="276" font-size="11.5" class="tr">FINAL_ACCEPTED → AgentRunResult → report · tool plan · SSE</text>
  <rect x="28" y="328" width="1044" height="216" rx="12" class="fs ss" stroke-width="1.8"/>
  <text x="46" y="355" font-size="16" class="ts" font-weight="700">CollaborationBlackboard (append-only)</text>
  <text x="46" y="376" font-size="12.5" class="mut">one immutable snapshot per round · all agents observe it · every update returns a new object (dataclasses.replace)</text>
  <rect x="44.0" y="388" width="243.25" height="140" rx="8" class="card cv" stroke-width="1.2"/>
  <text x="56.0" y="410" font-size="13.5" class="ts" font-weight="600">tasks : dict[str, AgentTask]</text>
  <text x="56.0" y="432" font-size="12" class="mut">status OPEN → CLAIMED → CLOSED</text>
  <text x="56.0" y="451" font-size="12" class="mut">priority LOW .. CRITICAL</text>
  <text x="56.0" y="470" font-size="12" class="mut">required_capabilities</text>
  <text x="56.0" y="489" font-size="12" class="mut">claimed_by · depends_on</text>
  <rect x="300.25" y="388" width="243.25" height="140" rx="8" class="card cv" stroke-width="1.2"/>
  <text x="312.25" y="410" font-size="13.5" class="ts" font-weight="600">events : tuple[AgentEvent]</text>
  <text x="312.25" y="432" font-size="12" class="mut">13 AgentEventType values</text>
  <text x="312.25" y="451" font-size="12" class="mut">TURN_STARTED · ROUND_STARTED</text>
  <text x="312.25" y="470" font-size="12" class="mut">TASK_CREATED · TASK_CLAIMED</text>
  <text x="312.25" y="489" font-size="12" class="mut">SAFETY_OVERRIDE</text>
  <text x="312.25" y="508" font-size="12" class="mut">FINAL_ACCEPTED</text>
  <rect x="556.5" y="388" width="243.25" height="140" rx="8" class="card cv" stroke-width="1.2"/>
  <text x="568.5" y="410" font-size="13.5" class="ts" font-weight="600">artifacts : tuple[AgentArtifact]</text>
  <text x="568.5" y="432" font-size="12" class="mut">intent · risk · context</text>
  <text x="568.5" y="451" font-size="12" class="mut">response_proposal · safety_review</text>
  <text x="568.5" y="470" font-size="12" class="mut">each carries a confidence score</text>
  <rect x="812.75" y="388" width="243.25" height="140" rx="8" class="card cv" stroke-width="1.2"/>
  <text x="824.75" y="410" font-size="13.5" class="ts" font-weight="600">messages : tuple[AgentMessage]</text>
  <text x="824.75" y="432" font-size="12" class="mut">sender → recipient inbox</text>
  <text x="824.75" y="451" font-size="12" class="mut">"*" = broadcast</text>
  <text x="824.75" y="470" font-size="12" class="mut">final_artifact_id =</text>
  <text x="824.75" y="489" font-size="12" class="mut">the accepted reply</text>
  <rect x="28.0" y="584" width="250.5" height="126" rx="10" class="fb sb" stroke-width="1.6"/>
  <text x="44.0" y="609" font-size="14" class="tb" font-weight="700">UnderstandingAgent</text>
  <text x="44.0" y="628" font-size="11.5" class="mut2">capability UNDERSTANDING</text>
  <text x="44.0" y="649" font-size="12" class="ink">confidence 0.78 · 0.92</text>
  <text x="44.0" y="668" font-size="12" class="ink">hard lexicon → LLM → consult lexicon</text>
  <text x="44.0" y="687" font-size="12" class="ink">publishes intent + topic</text>
  <rect x="292.5" y="584" width="250.5" height="126" rx="10" class="ft st" stroke-width="1.6"/>
  <text x="308.5" y="609" font-size="14" class="tt" font-weight="700">ContextAgent</text>
  <text x="308.5" y="628" font-size="11.5" class="mut2">capability CONTEXT</text>
  <text x="308.5" y="649" font-size="12" class="ink">confidence 0.82 · 0.86 · 0.88</text>
  <text x="308.5" y="668" font-size="12" class="ink">Redis memory → MySQL backfill</text>
  <text x="308.5" y="687" font-size="12" class="ink">rewrite → RAG → skill constraints</text>
  <rect x="557.0" y="584" width="250.5" height="126" rx="10" class="fg sg" stroke-width="1.6"/>
  <text x="573.0" y="609" font-size="14" class="tg" font-weight="700">ResponseAgent</text>
  <text x="573.0" y="628" font-size="11.5" class="mut2">capability RESPONSE</text>
  <text x="573.0" y="649" font-size="12" class="ink">confidence 0.78 · 0.84</text>
  <text x="573.0" y="668" font-size="12" class="ink">normal_chat vs support mode</text>
  <text x="573.0" y="687" font-size="12" class="ink">publishes the prompt plan</text>
  <rect x="821.5" y="584" width="250.5" height="126" rx="10" class="fr sr" stroke-width="1.6"/>
  <text x="837.5" y="609" font-size="14" class="tr" font-weight="700">SafetyAgent</text>
  <text x="837.5" y="628" font-size="11.5" class="mut2">capability SAFETY</text>
  <text x="837.5" y="649" font-size="12" class="ink">confidence 0.84 · 0.95 · 0.98</text>
  <text x="837.5" y="668" font-size="12" class="ink">HIGH → SAFETY_OVERRIDE · RISK</text>
  <text x="837.5" y="687" font-size="12" class="ink">review → REVISION_REQUESTED</text>
  <line x1="250" y1="288" x2="250" y2="324" class="lviolet" stroke-width="1.8" marker-end="url(#mk-violet)"/>
  <text x="262" y="313" font-size="12" class="tv">creates / injects tasks</text>
  <line x1="866" y1="328" x2="866" y2="292" class="lred" stroke-width="1.8" marker-end="url(#mk-red)"/>
  <text x="878" y="313" font-size="12" class="tr">artifacts to review</text>
  <line x1="153.25" y1="548" x2="153.25" y2="580" class="lg" stroke-width="1.6" marker-end="url(#mk-gray)" marker-start="url(#mk-gray)"/>
  <line x1="417.75" y1="548" x2="417.75" y2="580" class="lg" stroke-width="1.6" marker-end="url(#mk-gray)" marker-start="url(#mk-gray)"/>
  <line x1="682.25" y1="548" x2="682.25" y2="580" class="lg" stroke-width="1.6" marker-end="url(#mk-gray)" marker-start="url(#mk-gray)"/>
  <line x1="946.75" y1="548" x2="946.75" y2="580" class="lg" stroke-width="1.6" marker-end="url(#mk-gray)" marker-start="url(#mk-gray)"/>
  <text x="550.0" y="570" font-size="12" class="mut" text-anchor="middle">claim task  ↔  publish artifact</text>
  <rect x="28" y="750" width="1044" height="88" rx="10" class="fs ss" stroke-width="1.2"/>
  <text x="46" y="772" font-size="13" class="inks" font-weight="600">Typical HIGH-risk turn — event order verified by the engineering harness (mock provider):</text>
  <text x="46" y="794" font-size="12" class="mut">TURN_STARTED → ROUND_STARTED → TASK_CREATED ×4 → TASK_CLAIMED(SafetyAgent, 0.98) → SAFETY_OVERRIDE → TASK_CLAIMED(UnderstandingAgent)</text>
  <text x="46" y="812" font-size="12" class="mut">→ intent = RISK → TASK_CLAIMED(ContextAgent) → context artifact → TASK_CLAIMED(ResponseAgent) → response_proposal</text>
  <text x="46" y="830" font-size="12" class="mut">→ TASK_CLAIMED(SafetyAgent) → safety_review(approved) → FINAL_ACCEPTED</text>
</svg>
