<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 780" width="1240" height="780" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="MindBridge claim-based multi-agent collaboration runtime">
  <title>MindBridge — claim-based multi-agent collaboration runtime</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
    <marker id="aRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
    <marker id="aViolet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6d28d9"/>
    </marker>
    <marker id="aGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
    </marker>
  </defs>

  <rect width="1240" height="780" fill="#ffffff"/>
  <text x="30" y="40" font-size="21" font-weight="700" fill="#1f2933">Claim-based actor runtime: agents observe open tasks, claim work, publish artifacts</text>
  <text x="30" y="63" font-size="12.5" fill="#5b6b7c">No hard-coded agent chain. The coordinator owns the budget, the safety gate and final acceptance; workers race on confidence.</text>
  <line x1="30" y1="78" x2="1210" y2="78" stroke="#e3e8ee" stroke-width="1.5"/>

  <!-- Shared blackboard -->
  <rect x="405" y="252" width="430" height="250" rx="12" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="620" y="280" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">CollaborationBlackboard (append-only)</text>
  <text x="620" y="299" font-size="11" fill="#64748b" text-anchor="middle">immutable dataclasses + dataclasses.replace, no in-place mutation</text>

  <rect x="425" y="314" width="186" height="80" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="438" y="334" font-size="12" font-weight="600" fill="#0f172a">tasks : dict[str, AgentTask]</text>
  <text x="438" y="352" font-size="10.5" fill="#475569">status OPEN / CLAIMED / CLOSED</text>
  <text x="438" y="367" font-size="10.5" fill="#475569">priority LOW..CRITICAL</text>
  <text x="438" y="382" font-size="10.5" fill="#475569">required_capabilities, claimed_by</text>

  <rect x="627" y="314" width="186" height="80" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="640" y="334" font-size="12" font-weight="600" fill="#0f172a">events : tuple[AgentEvent]</text>
  <text x="640" y="352" font-size="10.5" fill="#475569">13 AgentEventType values</text>
  <text x="640" y="367" font-size="10.5" fill="#475569">TURN_STARTED, TASK_CREATED,</text>
  <text x="640" y="382" font-size="10.5" fill="#475569">TASK_CLAIMED, SAFETY_OVERRIDE…</text>

  <rect x="425" y="406" width="186" height="78" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="438" y="426" font-size="12" font-weight="600" fill="#0f172a">artifacts : tuple[…]</text>
  <text x="438" y="444" font-size="10.5" fill="#475569">intent · risk · context</text>
  <text x="438" y="459" font-size="10.5" fill="#475569">response_proposal · safety_review</text>
  <text x="438" y="474" font-size="10.5" fill="#475569">each carries a confidence score</text>

  <rect x="627" y="406" width="186" height="78" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="640" y="426" font-size="12" font-weight="600" fill="#0f172a">messages : tuple[…]</text>
  <text x="640" y="444" font-size="10.5" fill="#475569">sender → recipient inbox</text>
  <text x="640" y="459" font-size="10.5" fill="#475569">"*" = broadcast</text>
  <text x="640" y="474" font-size="10.5" fill="#475569">final_artifact_id = accepted reply</text>

  <!-- Coordinator -->
  <rect x="36" y="252" width="300" height="128" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="52" y="276" font-size="14" font-weight="700" fill="#4c1d95">CoordinatorAgent + EventDrivenCoordinator</text>
  <text x="52" y="297" font-size="11" fill="#475569">· creates the root task per turn</text>
  <text x="52" y="314" font-size="11" fill="#475569">· injects missing work (intent / risk / context / response)</text>
  <text x="52" y="331" font-size="11" fill="#475569">· ranks claims: priority → confidence → agent name</text>
  <text x="52" y="348" font-size="11" fill="#475569">· budget: 8 rounds · 4 claims/round · 3 claims/agent</text>
  <text x="52" y="365" font-size="11" fill="#475569">· FINAL_ACCEPTED only after safety review passes</text>

  <!-- Acceptance gate -->
  <rect x="36" y="404" width="300" height="150" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.8"/>
  <text x="52" y="428" font-size="14" font-weight="700" fill="#7f1d1d">Acceptance gate (_try_accept_final)</text>
  <text x="52" y="450" font-size="11" fill="#475569">1. response_proposal artifact exists</text>
  <text x="52" y="467" font-size="11" fill="#475569">2. safety_review artifact exists</text>
  <text x="52" y="484" font-size="11" fill="#475569">3. review.responseArtifactId == proposal.id</text>
  <text x="52" y="501" font-size="11" fill="#475569">4. review.approved is true</text>
  <text x="52" y="518" font-size="11" fill="#475569">5. proposal.confidence ≥ 0.60</text>
  <text x="52" y="539" font-size="11" fill="#7f1d1d">Otherwise the turn keeps claiming work until the budget is spent and emits BUDGET_EXHAUSTED.</text>

  <!-- Understanding -->
  <rect x="36" y="584" width="290" height="92" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
  <text x="52" y="608" font-size="13.5" font-weight="700" fill="#1e3a8a">UnderstandingAgent</text>
  <text x="52" y="628" font-size="11" fill="#475569">capability UNDERSTANDING · confidence 0.78 / 0.92</text>
  <text x="52" y="646" font-size="11" fill="#475569">hard risk lexicon → LLM classifier → consult lexicon</text>
  <text x="52" y="664" font-size="11" fill="#475569">publishes intent + topic, keeps a private intent history</text>

  <!-- Safety -->
  <rect x="352" y="584" width="290" height="92" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6"/>
  <text x="368" y="608" font-size="13.5" font-weight="700" fill="#7f1d1d">SafetyAgent</text>
  <text x="368" y="628" font-size="11" fill="#475569">capability SAFETY · confidence 0.84 / 0.95 / 0.98</text>
  <text x="368" y="646" font-size="11" fill="#475569">HIGH risk → emits SAFETY_OVERRIDE, forces the turn to RISK</text>
  <text x="368" y="664" font-size="11" fill="#475569">reviews the candidate reply; rejection → REVISION_REQUESTED</text>

  <!-- Context -->
  <rect x="668" y="584" width="278" height="92" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/>
  <text x="684" y="608" font-size="13.5" font-weight="700" fill="#134e4a">ContextAgent</text>
  <text x="684" y="628" font-size="11" fill="#475569">capability CONTEXT · confidence 0.82 / 0.86 / 0.88</text>
  <text x="684" y="646" font-size="11" fill="#475569">Redis short-term memory → MySQL backfill fallback</text>
  <text x="684" y="664" font-size="11" fill="#475569">query rewrite → RAG retrieval → skill constraints</text>

  <!-- Response -->
  <rect x="972" y="584" width="232" height="92" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="1.6"/>
  <text x="988" y="608" font-size="13.5" font-weight="700" fill="#14532d">ResponseAgent</text>
  <text x="988" y="628" font-size="11" fill="#475569">capability RESPONSE · 0.78 / 0.84</text>
  <text x="988" y="646" font-size="11" fill="#475569">normal_chat vs support mode</text>
  <text x="988" y="664" font-size="11" fill="#475569">publishes the prompt plan</text>

  <!-- Final output -->
  <rect x="972" y="404" width="232" height="150" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
  <text x="988" y="428" font-size="13.5" font-weight="700" fill="#0f172a">AgentRunResult → Harness</text>
  <text x="988" y="450" font-size="11" fill="#475569">intent · risk_level · assessment</text>
  <text x="988" y="467" font-size="11" fill="#475569">retrieved_knowledge · memory_brief</text>
  <text x="988" y="484" font-size="11" fill="#475569">response_messages (prompt plan)</text>
  <text x="988" y="501" font-size="11" fill="#475569">steps + collaboration events</text>
  <text x="988" y="518" font-size="11" fill="#475569">tasks + artifacts (full audit trail)</text>
  <text x="988" y="539" font-size="11" fill="#334155">Then: report → tool plan → SSE stream</text>

  <!-- Coordinator claim arrow -->
  <line x1="336" y1="316" x2="401" y2="316" stroke="#6d28d9" stroke-width="1.8" marker-end="url(#aViolet)"/>
  <text x="344" y="308" font-size="10.5" fill="#6d28d9">TASK_CREATED</text>

  <!-- Acceptance arrow -->
  <line x1="336" y1="480" x2="401" y2="480" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#aRed)"/>
  <text x="330" y="472" font-size="10.5" fill="#b91c1c">FINAL_ACCEPTED</text>

  <!-- Claim arrows -->
  <line x1="181" y1="580" x2="470" y2="506" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="196" y="556" font-size="10.5" fill="#1d4ed8">claim + publish intent</text>

  <line x1="497" y1="580" x2="560" y2="506" stroke="#b91c1c" stroke-width="1.6" marker-end="url(#aRed)"/>
  <text x="452" y="556" font-size="10.5" fill="#b91c1c">claim + publish risk</text>

  <line x1="807" y1="580" x2="700" y2="506" stroke="#0f766e" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="716" y="556" font-size="10.5" fill="#0f766e">claim + publish context</text>

  <line x1="1088" y1="580" x2="800" y2="506" stroke="#15803d" stroke-width="1.6" marker-end="url(#aGreen)"/>
  <text x="880" y="570" font-size="10.5" fill="#15803d">claim + publish response_proposal</text>

  <!-- review arrow Response -> Safety -->
  <path d="M 972 630 L 646 630" fill="none" stroke="#5b6b7c" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="700" y="624" font-size="10.5" fill="#475569">review request → safety_review artifact</text>

  <!-- Blackboard -> result -->
  <line x1="838" y1="420" x2="968" y2="440" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="846" y="410" font-size="10.5" fill="#334155">accepted_artifact()</text>

  <!-- Revision loop note -->
  <path d="M 455 584 L 455 556 L 340 556 L 340 540" fill="none" stroke="#b91c1c" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#aRed)"/>
  <text x="300" y="572" font-size="10.5" fill="#b91c1c">REVISION_REQUESTED</text>

  <!-- Event sequence strip -->
  <rect x="36" y="700" width="1168" height="56" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="52" y="722" font-size="11.5" font-weight="600" fill="#0f172a">Typical HIGH-risk turn (mock provider, verified by the engineering harness):</text>
  <text x="52" y="742" font-size="11" fill="#475569">TURN_STARTED → ROUND_STARTED → TASK_CREATED ×4 → TASK_CLAIMED(SafetyAgent, 0.98) → SAFETY_OVERRIDE → TASK_CLAIMED(UnderstandingAgent) → intent=RISK → TASK_CLAIMED(ContextAgent) → context → TASK_CLAIMED(ResponseAgent) → response_proposal → TASK_CLAIMED(SafetyAgent) → safety_review(approved) → FINAL_ACCEPTED</text>

  <!-- Legend -->
  <rect x="36" y="96" width="1168" height="46" rx="9" fill="#ffffff" stroke="#e3e8ee"/>
  <rect x="52" y="110" width="14" height="14" rx="3" fill="#f5f3ff" stroke="#6d28d9"/>
  <text x="74" y="122" font-size="11" fill="#475569">coordination / scheduling</text>
  <rect x="250" y="110" width="14" height="14" rx="3" fill="#fef2f2" stroke="#b91c1c"/>
  <text x="272" y="122" font-size="11" fill="#475569">safety gate</text>
  <rect x="392" y="110" width="14" height="14" rx="3" fill="#eff6ff" stroke="#1d4ed8"/>
  <text x="414" y="122" font-size="11" fill="#475569">understanding</text>
  <rect x="540" y="110" width="14" height="14" rx="3" fill="#f0fdfa" stroke="#0f766e"/>
  <text x="562" y="122" font-size="11" fill="#475569">context / retrieval</text>
  <rect x="700" y="110" width="14" height="14" rx="3" fill="#f0fdf4" stroke="#15803d"/>
  <text x="722" y="122" font-size="11" fill="#475569">response generation</text>
  <rect x="880" y="110" width="14" height="14" rx="3" fill="#f8fafc" stroke="#334155"/>
  <text x="902" y="122" font-size="11" fill="#475569">shared state / acceptance</text>
  <text x="1080" y="122" font-size="11" fill="#94a3b8">dashed = review / revision</text>

  <!-- Blackboard caption -->
  <text x="620" y="172" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">5 agents · 13 event types · 5 artifact kinds · 4 capabilities · no orchestration framework dependency</text>
</svg>
