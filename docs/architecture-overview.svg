  <text x="53.0" y="508" font-size="12.5" class="mut">task board · budget</text>
  <text x="53.0" y="525" font-size="12.5" class="mut">safety gate · acceptance</text>
  <rect x="247.6" y="466" width="193.6" height="64" rx="7" class="card cv" stroke-width="1.2"/>
  <text x="258.6" y="488" font-size="14" class="tv" font-weight="600">UnderstandingAgent</text>
  <text x="258.6" y="508" font-size="12.5" class="mut">intent artifact</text>
  <text x="258.6" y="525" font-size="12.5" class="mut">CHAT / CONSULT / RISK</text>
  <rect x="453.2" y="466" width="193.6" height="64" rx="7" class="card cv" stroke-width="1.2"/>
  <text x="464.2" y="488" font-size="14" class="tv" font-weight="600">SafetyAgent</text>
  <text x="464.2" y="508" font-size="12.5" class="mut">risk · SAFETY_OVERRIDE</text>
  <text x="464.2" y="525" font-size="12.5" class="mut">review · critique</text>
  <rect x="658.8" y="466" width="193.6" height="64" rx="7" class="card cv" stroke-width="1.2"/>
  <text x="669.8" y="488" font-size="14" class="tv" font-weight="600">ContextAgent</text>
  <text x="669.8" y="508" font-size="12.5" class="mut">memory · RAG evidence</text>
  <text x="669.8" y="525" font-size="12.5" class="mut">skill constraints</text>
  <rect x="864.4" y="466" width="193.6" height="64" rx="7" class="card cv" stroke-width="1.2"/>
  <text x="875.4" y="488" font-size="14" class="tv" font-weight="600">ResponseAgent</text>
  <text x="875.4" y="508" font-size="12.5" class="mut">response_proposal</text>
  <text x="875.4" y="525" font-size="12.5" class="mut">prompt plan</text>
  <rect x="42" y="540" width="1016" height="42" rx="7" class="card cardline" stroke-width="1.2"/>
  <text x="56" y="558" font-size="13.5" class="inks" font-weight="700">CollaborationBlackboard (append-only)</text>
  <text x="342" y="558" font-size="12.5" class="mut">tasks · events · artifacts · messages · final_artifact_id  ·  13 event types · 5 artifact kinds</text>
  <text x="56" y="575" font-size="11.5" class="mut2">frozen dataclasses: every update returns a new object (dataclasses.replace)</text>
  <text x="28" y="618" font-size="13.5" class="tc" font-weight="700" letter-spacing="1.2">5 · SERVICES &amp; PERSISTENCE</text>
  <rect x="28" y="628" width="1044" height="96" rx="10" class="fc sc" stroke-width="1.6"/>
  <rect x="42.0" y="642" width="193.6" height="68" rx="7" class="card cc" stroke-width="1.2"/>
  <text x="53.0" y="663" font-size="14" class="tc" font-weight="600">KnowledgeService</text>
  <text x="53.0" y="683" font-size="12.5" class="mut">BM25 + vector recall</text>
  <text x="53.0" y="700" font-size="12.5" class="mut">normalize · fuse · rerank</text>
  <rect x="247.6" y="642" width="193.6" height="68" rx="7" class="card cc" stroke-width="1.2"/>
  <text x="258.6" y="663" font-size="14" class="tc" font-weight="600">AiClient / Provider</text>
