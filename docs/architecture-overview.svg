  <rect class="bg" width="1100" height="746"/>
  <text x="28" y="36" font-size="23" class="inks" font-weight="700">MindBridge — a student message becomes a safe, auditable reply</text>
  <text x="28" y="60" font-size="13.5" class="mut">Python · FastAPI · SSE · claim-based multi-agent runtime · safety gate · hybrid RAG · async tool queue</text>
  <text x="1072" y="36" font-size="10.5" class="mut2" text-anchor="end" letter-spacing="1.6">MINDBRIDGE · REQUEST PIPELINE</text>
  <line x1="28" y1="76" x2="1072" y2="76" class="div" stroke-width="1.4"/>
  <text x="28" y="94" font-size="13.5" class="tt" font-weight="700" letter-spacing="1.2">1 · CLIENT / STATIC FRONTEND</text>
  <rect x="28" y="104" width="1044" height="72" rx="10" class="ft st" stroke-width="1.6"/>
  <rect x="42.0" y="116" width="243.5" height="48" rx="7" class="card ct" stroke-width="1.2"/>
  <text x="54.0" y="136" font-size="14.5" class="tt" font-weight="600">student.html · student.js</text>
  <text x="54.0" y="154" font-size="12.5" class="mut">SSE typewriter · Basic Auth</text>
  <rect x="299.5" y="116" width="243.5" height="48" rx="7" class="card ct" stroke-width="1.2"/>
  <text x="311.5" y="136" font-size="14.5" class="tt" font-weight="600">admin.html · admin.js</text>
  <text x="311.5" y="154" font-size="12.5" class="mut">reports · cases · jobs · traces</text>
  <rect x="557.0" y="116" width="243.5" height="48" rx="7" class="card ct" stroke-width="1.2"/>
  <text x="569.0" y="136" font-size="14.5" class="tt" font-weight="600">index.html · app.js</text>
  <text x="569.0" y="154" font-size="12.5" class="mut">entry / landing shell</text>
  <rect x="814.5" y="116" width="243.5" height="48" rx="7" class="card ct" stroke-width="1.2"/>
  <text x="826.5" y="136" font-size="14.5" class="tt" font-weight="600">HTTP Basic Auth</text>
  <text x="826.5" y="154" font-size="12.5" class="mut">ROLE_USER · ROLE_ADMIN · curl</text>
  <text x="28" y="202" font-size="13.5" class="tb" font-weight="700" letter-spacing="1.2">2 · HTTP LAYER</text>
  <text x="1072" y="202" font-size="11.5" class="mut2" text-anchor="end" letter-spacing="0.6">authentication + SSE framing only</text>
  <rect x="28" y="212" width="1044" height="72" rx="10" class="fb sb" stroke-width="1.6"/>
  <rect x="42.0" y="224" width="329.3333333333333" height="48" rx="7" class="card cb" stroke-width="1.2"/>
  <text x="54.0" y="244" font-size="14.5" class="tb" font-weight="600">POST /api/chat/stream</text>
  <text x="54.0" y="262" font-size="12.5" class="mut">StreamingResponse(text/event-stream)</text>
  <rect x="385.3333333333333" y="224" width="329.3333333333333" height="48" rx="7" class="card cb" stroke-width="1.2"/>
  <text x="397.3333333333333" y="244" font-size="14.5" class="tb" font-weight="600">GET /api/profile · /api/agent/status</text>
  <text x="397.3333333333333" y="262" font-size="12.5" class="mut">identity · runtime + skill readiness</text>
  <rect x="728.6666666666666" y="224" width="329.3333333333333" height="48" rx="7" class="card cb" stroke-width="1.2"/>
  <text x="740.6666666666666" y="244" font-size="14.5" class="tb" font-weight="600">/api/admin/* (14 routes)</text>
  <text x="740.6666666666666" y="262" font-size="12.5" class="mut">reports · cases · jobs · traces · knowledge</text>
  <text x="28" y="306" font-size="13.5" class="ta" font-weight="700" letter-spacing="1.2">3 · AGENT RUNTIME HARNESS</text>
  <text x="1072" y="306" font-size="11.5" class="mut2" text-anchor="end" letter-spacing="0.6">app/agents/harness.py</text>
  <rect x="28" y="316" width="1044" height="100" rx="10" class="fa sa" stroke-width="1.6"/>
  <text x="46" y="346" font-size="16" class="ta" font-weight="700">MindBridgeAgentHarness.run()</text>
  <text x="46" y="370" font-size="13.5" class="ink">sanitize input → resolve session → invoke agent runtime → persist messages → create report</text>
  <text x="46" y="392" font-size="13.5" class="ink">→ save agent trace → build tool plan → dispatch tools after the stream ends</text>
  <text x="46" y="410" font-size="12.5" class="mut">The HTTP layer stays thin: authentication + SSE framing only.</text>
  <text x="28" y="442" font-size="13.5" class="tv" font-weight="700" letter-spacing="1.2">4 · CLAIM-BASED MULTI-AGENT RUNTIME</text>
  <text x="1072" y="442" font-size="11.5" class="mut2" text-anchor="end" letter-spacing="0.6">5 agents · no orchestration framework</text>
  <rect x="28" y="452" width="1044" height="142" rx="10" class="fv sv" stroke-width="1.6"/>
  <rect x="42.0" y="466" width="193.6" height="64" rx="7" class="card cv" stroke-width="1.2"/>
