<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="788" viewBox="0 0 1200 788" role="img" aria-labelledby="title desc"><title id="title">MindBridge 当前系统架构</title><desc id="desc">HTTP准入后进入黑板协作；计划验收后，回复通道生成并审核正文，持久工具通道独立执行。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#7fa6b0"/></marker></defs><rect x="1" y="1" width="1198" height="786" rx="24" fill="#f5f9fa" stroke="#dbe6eb"/><text x="42" y="48" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="29" font-weight="750" fill="#173a48" text-anchor="start">一轮请求，两个安全阶段，一条独立的工具链</text><text x="43" y="78" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="400" fill="#65808c" text-anchor="start">风险是正常生成的前置条件；正文通过审核后才以 SSE 分块返回</text><rect x="40" y="107" width="1120" height="64" rx="14" fill="#173e4b" stroke="#173e4b"/><text x="66" y="148" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="650" fill="#f5fbfa" text-anchor="start">HTTP / Basic Auth</text><text x="1140" y="148" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="450" fill="#c0ddd8" text-anchor="end">60s 整轮预算 · 并发准入 · 同会话互斥</text><path d="M 600 171 L 600 198" fill="none" stroke="#7fa6b0" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="202" width="1120" height="329" rx="20" fill="#edf5f4" stroke="#bad5d0"/><text x="65" y="238" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#577d7a" text-anchor="start">EVENT-DRIVEN RUNTIME</text><rect x="65" y="259" width="1070" height="67" rx="12" fill="#fff" stroke="#bdd6d2"/><text x="88" y="288" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#125d5d" text-anchor="start">Coordinator + 共享黑板</text><text x="88" y="313" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#577580" text-anchor="start">任务依赖 / 能力认领 / artifact 发布 / 预算与计划验收</text><text x="1108" y="300" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="650" fill="#125d5d" text-anchor="end">8 项结构契约</text><path d="M 190 326 L 190 347" fill="none" stroke="#7fa6b0" stroke-width="2.5"/><rect x="65" y="349" width="251" height="150" rx="14" fill="#fff" stroke="#c8dedb"/><text x="83" y="383" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#234655" text-anchor="start">Understanding</text><text x="83" y="426" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="400" fill="#55727d" text-anchor="start">提出 CHAT / CONSULT / RISK</text><text x="83" y="455" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="400" fill="#55727d" text-anchor="start">独立风险结果可覆盖路由</text><path d="M 463 326 L 463 347" fill="none" stroke="#7fa6b0" stroke-width="2.5"/><rect x="338" y="349" width="251" height="150" rx="14" fill="#fff" stroke="#c8dedb"/><text x="356" y="383" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#234655" text-anchor="start">Safety</text><text x="356" y="426" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="400" fill="#55727d" text-anchor="start">风险评估与计划审查</text><text x="356" y="455" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="400" fill="#55727d" text-anchor="start">风险必须在正常生成前完成</text><path d="M 736 326 L 736 347" fill="none" stroke="#7fa6b0" stroke-width="2.5"/><rect x="611" y="349" width="251" height="150" rx="14" fill="#fff" stroke="#c8dedb"/><text x="629" y="383" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#234655" text-anchor="start">Context</text><text x="629" y="426" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="400" fill="#55727d" text-anchor="start">会话记忆 + Skills + RAG</text><text x="629" y="455" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="400" fill="#55727d" text-anchor="start">普通聊天跳过知识检索</text><path d="M 1009 326 L 1009 347" fill="none" stroke="#7fa6b0" stroke-width="2.5"/><rect x="884" y="349" width="251" height="150" rx="14" fill="#fff" stroke="#c8dedb"/><text x="902" y="383" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#234655" text-anchor="start">Response</text><text x="902" y="426" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="400" fill="#55727d" text-anchor="start">构建 response_proposal</text><text x="902" y="455" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="400" fill="#55727d" text-anchor="start">产物是 prompt 计划</text><path d="M 600 531 L 600 555" fill="none" stroke="#7fa6b0" stroke-width="2.5"/><path d="M 600 555 L 370 555" fill="none" stroke="#7fa6b0" stroke-width="2.5"/><path d="M 600 555 L 955 555" fill="none" stroke="#7fa6b0" stroke-width="2.5"/><path d="M 370 555 L 370 585" fill="none" stroke="#7fa6b0" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 955 555 L 955 585" fill="none" stroke="#7fa6b0" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="591" width="664" height="158" rx="18" fill="#fff" stroke="#bcd8d5"/><text x="64" y="625" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#50817c" text-anchor="start">回复通道</text><text x="64" y="660" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="700" fill="#174b55" text-anchor="start">生成正文 → 规则 + 模型审核 → SSE</text><text x="64" y="699" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="400" fill="#5b7680" text-anchor="start">最多一次修订；失败使用固定安全兜底</text><text x="64" y="726" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="400" fill="#728892" text-anchor="start">计划 approved 与实际正文 approved 分开记录</text><rect x="730" y="591" width="430" height="158" rx="18" fill="#f0f0fb" stroke="#d1d0e8"/><text x="754" y="625" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#69618e" text-anchor="start">持久化工具通道</text><text x="754" y="660" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#454269" text-anchor="start">报告 + outbox 同事务提交</text><text x="754" y="699" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="400" fill="#6f6a89" text-anchor="start">Excel / 个案 → 预警 · 租约与重试</text><text x="754" y="726" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="400" fill="#7e7895" text-anchor="start">独立 Worker；SSE 断连不取消任务</text></svg>
