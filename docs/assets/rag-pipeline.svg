<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="399" viewBox="0 0 1200 399" role="img" aria-labelledby="title desc"><title id="title">MindBridge 混合RAG检索</title><desc id="desc">查询分别进入向量和BM25召回，对齐候选并归一化融合，本地重排后选择Top4，线上可做上下文扩展。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#7fa6b0"/></marker></defs><rect x="1" y="1" width="1198" height="397" rx="24" fill="#f6f9fb" stroke="#dce6ed"/><text x="40" y="49" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="750" fill="#173a48" text-anchor="start">语义与词面互补，按同一 chunk 对齐融合</text><text x="40" y="80" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="400" fill="#647e8a" text-anchor="start">候选并集 → 分路归一化 → 加权融合 → 本地词面重排 → 上下文扩展</text><rect x="40" y="142" width="177" height="102" rx="16" fill="#183d4b" stroke="#183d4b"/><text x="128" y="181" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="650" fill="#f5fbfa" text-anchor="middle">查询改写</text><text x="128" y="213" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#c0dbd9" text-anchor="middle">咨询 / 风险按需触发</text><path d="M 217 193 L 237 193" fill="none" stroke="#7fa6b0" stroke-width="2.5"/><path d="M 237 193 L 237 145" fill="none" stroke="#7fa6b0" stroke-width="2.5"/><path d="M 237 193 L 237 271" fill="none" stroke="#7fa6b0" stroke-width="2.5"/><path d="M 237 145 L 268 145" fill="none" stroke="#7fa6b0" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 237 271 L 268 271" fill="none" stroke="#7fa6b0" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="276" y="105" width="292" height="87" rx="14" fill="#eaf6f2" stroke="#c0dbd0"/><text x="294" y="137" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="650" fill="#17685f" text-anchor="start">Chroma · 向量召回</text><text x="294" y="169" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="400" fill="#5c7e79" text-anchor="start">Qwen embedding · cosine</text><rect x="276" y="230" width="292" height="87" rx="14" fill="#edf0fb" stroke="#ccd4e9"/><text x="294" y="262" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="650" fill="#4e608c" text-anchor="start">BM25 · 关键词召回</text><text x="294" y="294" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="400" fill="#69758e" text-anchor="start">本地分词 · 词频 / IDF / 长度归一</text><path d="M 568 148 L 592 148" fill="none" stroke="#7fa6b0" stroke-width="2.5"/><path d="M 568 274 L 592 274" fill="none" stroke="#7fa6b0" stroke-width="2.5"/><path d="M 592 148 L 592 211" fill="none" stroke="#7fa6b0" stroke-width="2.5"/><path d="M 592 274 L 592 211" fill="none" stroke="#7fa6b0" stroke-width="2.5"/><path d="M 592 211 L 625 211" fill="none" stroke="#7fa6b0" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="633" y="153" width="225" height="116" rx="16" fill="#fff" stroke="#cbdce1"/><text x="650" y="187" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="650" fill="#285366" text-anchor="start">按 chunk ID 合并</text><text x="650" y="220" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="400" fill="#627d89" text-anchor="start">vector 0.65 + BM25 0.35</text><text x="650" y="248" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="400" fill="#627d89" text-anchor="start">不同召回列表可以对齐</text><path d="M 858 211 L 892 211" fill="none" stroke="#7fa6b0" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="900" y="153" width="260" height="116" rx="16" fill="#eaf5f2" stroke="#c0d8d0"/><text x="918" y="187" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="650" fill="#1d655b" text-anchor="start">重排 → Top 4 → 扩展</text><text x="918" y="220" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#5e7c74" text-anchor="start">本地词面特征重排</text><text x="918" y="248" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="400" fill="#5e7c74" text-anchor="start">向量异常时显式降级</text><text x="40" y="363" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="400" fill="#547482" text-anchor="start">当前知识库：11 文档 / 34 chunk / 512 字符切块 / 64 字符重叠 / 1024 维向量</text></svg>
