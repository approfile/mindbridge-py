<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" width="1100" height="720" font-family="Segoe UI, Roboto, Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" role="img" aria-label="Async tool queue: enqueue after the SSE stream, risk-scoped policy and dependency gates, retry with linear backoff, dead letters and a shared implementation with the MCP stdio mode">
  <title>MindBridge — asynchronous tool queue</title>
  <defs>
    <marker id="mk-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="mg" d="M 0 0 L 10 5 L 0 10 z"/></marker>
    <marker id="mk-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="mv" d="M 0 0 L 10 5 L 0 10 z"/></marker>
    <marker id="mk-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="mr" d="M 0 0 L 10 5 L 0 10 z"/></marker>
    <marker id="mk-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="mb" d="M 0 0 L 10 5 L 0 10 z"/></marker>
    <marker id="mk-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="mt" d="M 0 0 L 10 5 L 0 10 z"/></marker>
    <marker id="mk-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="mgr" d="M 0 0 L 10 5 L 0 10 z"/></marker>
    <marker id="mk-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="ma" d="M 0 0 L 10 5 L 0 10 z"/></marker>
    <marker id="mk-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="ms" d="M 0 0 L 10 5 L 0 10 z"/></marker>
  </defs>
  <style>
  svg {
    --bg:#ffffff; --ink:#1c2530; --ink-strong:#0f172a; --muted:#5b6b7c; --muted-2:#64748b;
    --line:#e3e8ee; --card:#ffffff; --card-border:#cbd5e1; --arrow:#5b6b7c; --arrow-strong:#334155;
    --violet:#6d28d9; --violet-fill:#f5f3ff; --violet-line:#ddd6fe; --violet-ink:#4c1d95;
    --red:#b91c1c; --red-fill:#fef2f2; --red-line:#fecaca; --red-ink:#7f1d1d;
    --blue:#1d4ed8; --blue-fill:#eff6ff; --blue-line:#bfdbfe; --blue-ink:#1e3a8a;
    --teal:#0f766e; --teal-fill:#f0fdfa; --teal-line:#99f6e4; --teal-ink:#134e4a;
    --green:#15803d; --green-fill:#f0fdf4; --green-line:#bbf7d0; --green-ink:#14532d;
    --amber:#b45309; --amber-fill:#fffbeb; --amber-line:#fde68a; --amber-ink:#78350f;
    --slate:#334155; --slate-fill:#f8fafc; --slate-line:#cbd5e1; --slate-ink:#0f172a;
    --cyan:#0e7490; --cyan-fill:#ecfeff; --cyan-line:#a5f3fc; --cyan-ink:#155e75;
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --bg:#0d1117; --ink:#e6edf3; --ink-strong:#f0f6fc; --muted:#9da9b6; --muted-2:#8b949e;
      --line:#30363d; --card:#151b23; --card-border:#30363d; --arrow:#8b949e; --arrow-strong:#c9d1d9;
      --violet:#a78bfa; --violet-fill:#1b1630; --violet-line:#4c1d95; --violet-ink:#c4b5fd;
      --red:#f87171; --red-fill:#2a1316; --red-line:#7f1d1d; --red-ink:#fca5a5;
      --blue:#60a5fa; --blue-fill:#0f1a33; --blue-line:#1e3a8a; --blue-ink:#93c5fd;
      --teal:#2dd4bf; --teal-fill:#082420; --teal-line:#115e59; --teal-ink:#5eead4;
      --green:#4ade80; --green-fill:#0b2415; --green-line:#14532d; --green-ink:#86efac;
      --amber:#fbbf24; --amber-fill:#271d0b; --amber-line:#78350f; --amber-ink:#fcd34d;
      --slate:#94a3b8; --slate-fill:#151b23; --slate-line:#30363d; --slate-ink:#e6edf3;
      --cyan:#22d3ee; --cyan-fill:#07222a; --cyan-line:#155e75; --cyan-ink:#67e8f9;
    }
  }
  .bg{fill:var(--bg)}
  .ink{fill:var(--ink)} .inks{fill:var(--ink-strong)} .mut{fill:var(--muted)} .mut2{fill:var(--muted-2)}
  .div{stroke:var(--line)}
  .card{fill:var(--card)} .cardline{stroke:var(--card-border)}
  .fv{fill:var(--violet-fill)} .sv{stroke:var(--violet)} .tv{fill:var(--violet-ink)}
  .fr{fill:var(--red-fill)} .sr{stroke:var(--red)} .tr{fill:var(--red-ink)}
  .fb{fill:var(--blue-fill)} .sb{stroke:var(--blue)} .tb{fill:var(--blue-ink)}
  .ft{fill:var(--teal-fill)} .st{stroke:var(--teal)} .tt{fill:var(--teal-ink)}
  .fg{fill:var(--green-fill)} .sg{stroke:var(--green)} .tg{fill:var(--green-ink)}
  .fa{fill:var(--amber-fill)} .sa{stroke:var(--amber)} .ta{fill:var(--amber-ink)}
  .fs{fill:var(--slate-fill)} .ss{stroke:var(--slate)} .ts{fill:var(--slate-ink)}
  .fc{fill:var(--cyan-fill)} .sc{stroke:var(--cyan)} .tc{fill:var(--cyan-ink)}
  .lg{stroke:var(--arrow)} .lv{stroke:var(--violet)} .lr{stroke:var(--red)} .lb{stroke:var(--blue)}
  .lt{stroke:var(--teal)} .lgr{stroke:var(--green)} .la{stroke:var(--amber)} .ls{stroke:var(--slate)}
  .mg{fill:var(--arrow)} .mv{fill:var(--violet)} .mr{fill:var(--red)} .mb{fill:var(--blue)}
  .mt{fill:var(--teal)} .mgr{fill:var(--green)} .ma{fill:var(--amber)} .ms{fill:var(--slate)}
</style>
  <rect class="bg" width="1100" height="720"/>
  <text x="28" y="36" font-size="23" class="inks" font-weight="700">Async tool queue — dependency gates, retries and dead letters</text>
  <text x="28" y="60" font-size="13.5" class="mut">A slow SMTP call must never block the student's reply: tools run after the stream ends, on a queue with retries and dead letters</text>
  <text x="1072" y="36" font-size="10.5" class="mut2" text-anchor="end" letter-spacing="1.6">MINDBRIDGE · TOOL QUEUE</text>
  <line x1="28" y1="76" x2="1072" y2="76" class="div" stroke-width="1.4"/>
  <rect x="28" y="90" width="1044" height="74" rx="10" class="fb sb" stroke-width="1.6"/>
  <text x="44" y="114" font-size="14" class="tb" font-weight="700">Trigger — harness dispatches the tool plan after the SSE stream ends</text>
  <text x="44" y="136" font-size="12" class="ink">Synchronous Excel / SMTP work would add seconds of latency to a crisis reply.</text>
  <rect x="508" y="100" width="252" height="54" rx="7" class="card cg" stroke-width="1.2"/>
  <text x="520" y="118" font-size="11.5" class="tg" font-weight="700">ASYNC QUEUE  (default)</text>
  <text x="520" y="134" font-size="11" class="mut">TOOL_QUEUE_ENABLED=true</text>
  <text x="520" y="148" font-size="11" class="mut2">retry · rate limit · dead letter</text>
  <rect x="776" y="100" width="296" height="54" rx="7" class="card cs" stroke-width="1.2"/>
  <text x="788" y="118" font-size="11.5" class="ts" font-weight="700">MCP STDIO  (demo / debugging)</text>
  <text x="788" y="134" font-size="11" class="mut">TOOL_QUEUE_ENABLED=false</text>
  <text x="788" y="148" font-size="11" class="mut2">same ToolOrchestrationService implementation</text>
  <rect x="28" y="180" width="1044" height="264" rx="10" class="fs ss" stroke-width="1.4"/>
  <text x="44" y="202" font-size="14" class="ts" font-weight="700">Queue lifecycle — one implementation, two execution modes</text>
  <rect x="28" y="214" width="196" height="88" rx="9" class="fb sb" stroke-width="1.5"/>
  <text x="42" y="238" font-size="13" class="tb" font-weight="700">1 · ENQUEUE</text>
  <text x="42" y="260" font-size="11.5" class="ink">status PENDING</text>
  <text x="42" y="278" font-size="11.5" class="mut">job written after stream ends</text>
  <line x1="225" y1="258" x2="237" y2="258" class="lgray" stroke-width="1.5" marker-end="url(#mk-gray)"/>
  <rect x="240" y="214" width="196" height="88" rx="9" class="ft st" stroke-width="1.5"/>
  <text x="254" y="238" font-size="13" class="tt" font-weight="700">2 · CLAIM</text>
  <text x="254" y="260" font-size="11.5" class="ink">status RUNNING</text>
  <text x="254" y="278" font-size="11.5" class="mut">restart: RUNNING → PENDING</text>
  <line x1="437" y1="258" x2="449" y2="258" class="lgray" stroke-width="1.5" marker-end="url(#mk-gray)"/>
  <rect x="452" y="214" width="196" height="88" rx="9" class="fv sv" stroke-width="1.5"/>
  <text x="466" y="238" font-size="13" class="tv" font-weight="700">3 · CHECK</text>
  <text x="466" y="260" font-size="11.5" class="ink">risk-scoped allow-list</text>
  <text x="466" y="278" font-size="11.5" class="mut">depends_on gate · requeue</text>
  <line x1="649" y1="258" x2="661" y2="258" class="lgray" stroke-width="1.5" marker-end="url(#mk-gray)"/>
  <rect x="664" y="214" width="196" height="88" rx="9" class="fa sa" stroke-width="1.5"/>
  <text x="678" y="238" font-size="13" class="ta" font-weight="700">4 · EXECUTE</text>
  <text x="678" y="260" font-size="11.5" class="ink">Excel · case · SMTP</text>
  <text x="678" y="278" font-size="11.5" class="mut">same code in MCP mode</text>
  <line x1="861" y1="258" x2="873" y2="258" class="lgray" stroke-width="1.5" marker-end="url(#mk-gray)"/>
  <rect x="876" y="214" width="196" height="88" rx="9" class="fg sg" stroke-width="1.5"/>
  <text x="890" y="238" font-size="13" class="tg" font-weight="700">5 · OUTCOME</text>
  <text x="890" y="260" font-size="11.5" class="ink">SUCCEEDED</text>
  <text x="890" y="278" font-size="11.5" class="mut">audit row on every attempt</text>
  <rect x="28" y="340" width="420" height="86" rx="9" class="fa sa" stroke-width="1.5"/>
  <text x="44" y="364" font-size="13" class="ta" font-weight="700">RETRY — attempt &lt; 3</text>
  <text x="44" y="385" font-size="11.5" class="ink">linear backoff: 15s · 30s · 45s</text>
  <text x="44" y="403" font-size="11.5" class="mut">job is re-enqueued as PENDING</text>
  <rect x="470" y="340" width="320" height="86" rx="9" class="fr sr" stroke-width="1.5"/>
  <text x="486" y="364" font-size="13" class="tr" font-weight="700">DEAD — attempt = 3</text>
  <text x="486" y="385" font-size="11.5" class="ink">dead_letter_records</text>
  <text x="486" y="403" font-size="11.5" class="mut">kind · reason · payload kept</text>
  <rect x="812" y="340" width="260" height="86" rx="9" class="fs ss" stroke-width="1.5"/>
  <text x="828" y="364" font-size="13" class="ts" font-weight="700">RATE LIMIT — ALERT_SEND</text>
  <text x="828" y="385" font-size="11.5" class="ink">60 s sliding window · 30/min</text>
  <text x="828" y="403" font-size="11.5" class="mut">over limit → retry_after</text>
  <path d="M 880 302 V 322 H 200 V 336" fill="none" class="lg" stroke-width="1.6" marker-end="url(#mk-gray)"/>
  <text x="560" y="316" font-size="11.5" class="mut2" text-anchor="middle">failure</text>
  <path d="M 120 340 V 306" fill="none" class="lg" stroke-width="1.6" marker-end="url(#mk-gray)"/>
  <text x="112" y="330" font-size="11" class="mut2" text-anchor="end">re-enqueue</text>
  <line x1="448" y1="383" x2="466" y2="383" class="lgray" stroke-width="1.5" marker-end="url(#mk-gray)"/>
  <line x1="1000" y1="340" x2="1000" y2="306" class="lr" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#mk-red)"/>
  <text x="1012" y="326" font-size="11" class="tr">retry_after</text>
  <rect x="28" y="462" width="1044" height="164" rx="10" class="ft st" stroke-width="1.6"/>
  <text x="44" y="484" font-size="14" class="tt" font-weight="700">Dependency chain — a job runs only after its parent job succeeded</text>
  <rect x="46" y="496" width="240" height="96" rx="8" class="card ct" stroke-width="1.2"/>
  <text x="58" y="518" font-size="13" class="tt" font-weight="600">PsychologicalReport</text>
  <text x="58" y="538" font-size="11.5" class="ink">risk = HIGH</text>
  <text x="58" y="556" font-size="11.5" class="mut">source of the tool plan</text>
  <text x="58" y="574" font-size="11.5" class="mut">report_id = idempotency key</text>
  <rect x="316" y="496" width="260" height="58" rx="8" class="card ct" stroke-width="1.2"/>
  <text x="328" y="516" font-size="12.5" class="tt" font-weight="600">EXCEL_REPORT</text>
  <text x="328" y="535" font-size="11.5" class="mut">allowed LOW · MEDIUM · HIGH</text>
  <rect x="316" y="562" width="260" height="58" rx="8" class="card ct" stroke-width="1.2"/>
  <text x="328" y="582" font-size="12.5" class="tt" font-weight="600">CASE_CREATE</text>
  <text x="328" y="601" font-size="11.5" class="mut">allowed MEDIUM · HIGH</text>
  <rect x="636" y="562" width="280" height="58" rx="8" class="card ct" stroke-width="1.2"/>
  <text x="648" y="582" font-size="12.5" class="tt" font-weight="600">ALERT_SEND</text>
  <text x="648" y="601" font-size="11.5" class="mut">allowed HIGH only · depends_on CASE</text>
  <line x1="286" y1="525" x2="312" y2="525" class="lgray" stroke-width="1.5" marker-end="url(#mk-gray)"/>
  <line x1="286" y1="591" x2="312" y2="591" class="lgray" stroke-width="1.5" marker-end="url(#mk-gray)"/>
  <line x1="578" y1="591" x2="632" y2="591" class="lgray" stroke-width="1.5" marker-end="url(#mk-gray)"/>
  <text x="605" y="580" font-size="10.5" class="mut2" text-anchor="middle">depends_on</text>
  <rect x="28" y="644" width="1044" height="60" rx="9" class="fs ss" stroke-width="1.0"/>
  <text x="44" y="666" font-size="12" class="mut">Crash recovery: leftover RUNNING jobs are reset to PENDING on startup  ·  every attempt writes tool_audit_records</text>
  <text x="44" y="688" font-size="12" class="mut">TOOL_QUEUE_MAX_ATTEMPTS=3  ·  TOOL_QUEUE_RETRY_DELAY_SECONDS=15  ·  MCP stdio mode needs no broker</text>
</svg>
